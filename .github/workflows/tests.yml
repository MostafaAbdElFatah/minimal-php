name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly mutation run
  workflow_dispatch:

env:
  APP_ENV: testing

jobs:
  fast:
    name: Architecture, unit and feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: composer test:arch
      - run: composer test:unit
      - run: composer test:random

  quality:
    name: Coverage and type coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, pcov
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: composer test:coverage
      - run: composer test:types
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/

  browser:
    name: Browser
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npx playwright install --with-deps chromium
      - run: cp .env.example .env && php artisan key:generate
      - run: composer test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots

  mutation:
    name: Mutation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, pcov
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: composer test:mutate

  stress:
    name: Stress (manual, against staging)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: composer test:stress
        env:
          STRESS_URL: ${{ vars.STRESS_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: stress-reports
          path: reports/stress
